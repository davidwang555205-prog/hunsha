# 自动化同步：本地 push → GitHub → Codeup（云效内网 clone）→ 云效流水线部署
#
# 触发链：本地 git push origin {main,dev-dao,production} → 本 Action 跑 git push codeup {branch} → Codeup 触发云效流水线
# 凭据：SSH deploy key（私钥走 GitHub Secret CODEUP_SSH_KEY，公钥已加 Codeup 个人设置）
# 详见 .claude/knowledge/14-codeup-mirror.md

name: Sync to Codeup

# 只监听 production 分支 push（dev-dao 是开发中间态，云效流水线不取，无需同步）
on:
  push:
    branches:
      - production
    tags-ignore:
      - "**"

jobs:
  sync:
    name: Mirror pushed branch to Codeup
    runs-on: ubuntu-latest
    # 单 job 单分支：避免并发 push 冲突；不并发
    concurrency:
      group: codeup-sync
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 保留完整 history 便于 Codeup 看到 commit 关系
          fetch-depth: 0

      - name: Setup SSH key
        env:
          CODEUP_SSH_KEY: ${{ secrets.CODEUP_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # 私钥写入临时文件（mode 600，避免 GitHub 警告）
          echo "$CODEUP_SSH_KEY" > ~/.ssh/codeup_deploy_key
          chmod 600 ~/.ssh/codeup_deploy_key
          # 首次连接：跳过 fingerprint 交互
          ssh-keyscan -t ed25519,rsa codeup.aliyun.com >> ~/.ssh/known_hosts
          # 测试连通（不传命令，纯 SSH 连接测试）
          ssh -T -o StrictHostKeyChecking=accept-new git@codeup.aliyun.com || true

      - name: Push branch to Codeup
        env:
          CODEUP_REPO_SSH_URL: ${{ secrets.CODEUP_REPO_SSH_URL }}
          PUSHED_BRANCH: ${{ github.ref_name }}
        run: |
          # 删旧 remote（workflow 缓存导致旧值残留）
          git remote remove codeup 2>/dev/null || true
          git remote add codeup "$CODEUP_REPO_SSH_URL"
          # 推当前触发分支到 Codeup 同名分支
          # 使用 push 而不是 mirror：保留只推触发分支，tags 走 ignore
          git push codeup "$PUSHED_BRANCH:$PUSHED_BRANCH"
          echo "[OK] $PUSHED_BRANCH synced to codeup at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
